name: Keep Supabase alive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call health endpoint
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            --max-time 30 "${{ vars.SITE_URL }}/api/health"
